<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบเช็คชื่อ</title>

<style>

body{
  font-family:Arial;
  text-align:center;
  background:#f2f2f2;
  padding:20px;
}

video, canvas{
  width:350px;
  max-width:95%;
  border:4px solid #333;
  border-radius:10px;
  margin-top:25px;
}

.input-group{
  margin-top:15px;
}

label{
  display:block;
  font-size:18px;
  margin-bottom:8px;
  font-weight:bold;
}

input, select{
  width:250px;
  padding:12px;
  font-size:18px;
  border-radius:8px;
  border:1px solid #ccc;
}

.select-group{
  margin-top:25px;
}

button{
  margin-top:20px;
  padding:15px 30px;
  font-size:18px;
  background:#1976d2;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-left:5px;
  margin-right:5px;
}

button:hover{
  opacity:0.9;
}

#status{
  margin-top:20px;
  font-size:20px;
  color:green;
  font-weight:bold;
}

.success-page{
  display:none;
  margin-top:100px;
}

.success-page h1{
  color:green;
  font-size:42px;
}

.success-page p{
  font-size:24px;
}

#preview{
  width:350px;
  max-width:95%;
  border-radius:10px;
  display:none;
  border:4px solid #4caf50;
  margin-top:20px;
}

</style>

</head>

<body>

<div id="mainPage">

<h1>ระบบเช็คชื่อพนักงาน</h1>

<div class="input-group">

<label>รหัสพนักงาน</label>

<input
  type="text"
  id="emp_id"
  placeholder="กรอกรหัสพนักงาน">

</div>

<div class="select-group">

<label>เลือกประเภท</label>

<select id="type">
  <option value="IN">เข้างาน</option>
  <option value="OUT">ออกงาน</option>
</select>

</div>

<br>

<video
  id="video"
  autoplay
  playsinline>
</video>

<canvas
  id="canvas"
  style="display:none;">
</canvas>

<br>

<img id="preview">

<br>

<button onclick="startCamera()">
🎥 เปิดกล้อง
</button>

<button onclick="takePhoto()">
📸 ถ่ายรูป
</button>

<button onclick="capture()">
✅ เช็คชื่อ
</button>

<div id="status"></div>

</div>

<div class="success-page" id="successPage">

<h1>เช็คชื่อเรียบร้อย!!</h1>

<p>บันทึกข้อมูลสำเร็จ</p>

</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbwv-yh1hJPzm8sjztqSugsgbuOGZj9zXtG6OZHftWIo2rD1ijSrF1b4Eo2mdvTcUNT0/exec';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusText = document.getElementById('status');

let latitude = '';
let longitude = '';

let capturedImage = '';

navigator.geolocation.getCurrentPosition(
  function(position){

    latitude = position.coords.latitude;
    longitude = position.coords.longitude;

  }
);

async function startCamera(){

  try{

    const stream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    video.srcObject = stream;

    statusText.innerHTML = 'เปิดกล้องสำเร็จ';

  }catch(err){

    console.error(err);

    statusText.innerHTML = err.message;

  }
}

function takePhoto(){

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext('2d');

  ctx.drawImage(video,0,0);

  capturedImage = canvas.toDataURL('image/png');

  const preview =
    document.getElementById('preview');

  preview.src = capturedImage;

  preview.style.display = 'block';

  statusText.innerHTML = 'ถ่ายรูปเรียบร้อย';

}

async function capture(){

  const empId =
    document.getElementById('emp_id').value;

  const type =
    document.getElementById('type').value;

  if(!empId){

    alert('กรอกรหัสพนักงาน');
    return;

  }

  if(!capturedImage){

    alert('กรุณาถ่ายรูปก่อน');
    return;

  }

  statusText.innerHTML = 'กำลังบันทึก...';

  try{

    const response = await fetch(API_URL, {

      method:'POST',

      body:JSON.stringify({

        emp_id:empId,
        type:type,
        latitude:latitude,
        longitude:longitude,
        image:capturedImage

      })

    });

    const result = await response.json();

    console.log(result);

    if(result.status == 'success'){

      document.getElementById('mainPage').style.display = 'none';

      document.getElementById('successPage').style.display = 'block';

    }else{

      statusText.innerHTML =
        result.message || 'เกิดข้อผิดพลาด';

    }

  }catch(error){

    console.error(error);

    statusText.innerHTML =
      'เชื่อมต่อระบบไม่สำเร็จ';

  }

}

</script>

</body>
</html>
