<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบเช็คชื่อ</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial;
  text-align:center;
  background:#f2f2f2;
  padding:20px;
}

video, canvas{
  width:350px;
  max-width:95%;
  border:4px solid #333;
  border-radius:10px;
  margin-top:25px;
}

.input-group{
  margin-top:15px;
}

label{
  display:block;
  font-size:18px;
  margin-bottom:8px;
  font-weight:bold;
}

input, select{
  width:250px;
  padding:12px;
  font-size:18px;
}

.select-group{
  margin-top:25px;
}

button{
  margin-top:20px;
  padding:15px 30px;
  font-size:18px;
  background:#1976d2;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#status{
  margin-top:20px;
  font-size:20px;
  color:green;
  font-weight:bold;
}

.success-page{
  display:none;
  margin-top:100px;
}

.success-page h1{
  color:green;
  font-size:40px;
}

.success-page p{
  font-size:24px;
}

</style>

</head>
<body>

<div id="mainPage">

<h1>ระบบเช็คชื่อเข้างาน</h1>

<div class="input-group">
  <label>รหัสพนักงาน</label>

  <input
    type="text"
    id="emp_id"
    placeholder="กรอกรหัสพนักงาน">
</div>

<div class="select-group">

  <label>เลือกประเภท</label>

  <select id="type">
    <option value="IN">เข้างาน</option>
    <option value="OUT">ออกงาน</option>
  </select>

</div>

<br>

<video
  id="video"
  autoplay
  playsinline>
</video>

<canvas
  id="canvas"
  style="display:none;">
</canvas>

<br>

<button onclick="startCamera()">
เปิดกล้อง
</button>

<button onclick="capture()">
เช็คชื่อ
</button>

<div id="status"></div>

</div>

<div class="success-page" id="successPage">

<h1>เช็คชื่อเรียบร้อย!!</h1>

<p>บันทึกข้อมูลสำเร็จ</p>

</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbwv-yh1hJPzm8sjztqSugsgbuOGZj9zXtG6OZHftWIo2rD1ijSrF1b4Eo2mdvTcUNT0/exec';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusText = document.getElementById('status');

let latitude = '';
let longitude = '';

navigator.geolocation.getCurrentPosition(
  function(position){

    latitude = position.coords.latitude;
    longitude = position.coords.longitude;

  }
);

async function startCamera(){

  try{

    const stream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    video.srcObject = stream;

    statusText.innerHTML = 'เปิดกล้องสำเร็จ';

  }catch(err){

    console.error(err);

    statusText.innerHTML = err.message;

  }
}

async function capture(){

  const empId =
    document.getElementById('emp_id').value;

  const type =
    document.getElementById('type').value;

  if(!empId){

    alert('กรอกรหัสพนักงาน');
    return;

  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext('2d');

  ctx.drawImage(video,0,0);

  const image = canvas.toDataURL('image/png');

  statusText.innerHTML = 'กำลังบันทึก...';

  const response = await fetch(API_URL, {

    method:'POST',

    body:JSON.stringify({

      emp_id:empId,
      type:type,
      latitude:latitude,
      longitude:longitude,
      image:image

    })

  });

  const result = await response.json();

  if(result.status == 'success'){

    document.getElementById('mainPage').style.display = 'none';

    document.getElementById('successPage').style.display = 'block';

  }else{

    statusText.innerHTML =
      result.message;

  }
}

</script>

</body>
</html>
