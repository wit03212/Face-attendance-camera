<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบเช็คชื่อพนักงาน</title>

<style>

body{
  font-family:Arial;
  text-align:center;
  background:#f2f2f2;
  padding:20px;
}

.input-group{
  margin-top:15px;
}

label{
  display:block;
  font-size:18px;
  margin-bottom:8px;
  font-weight:bold;
}

input, select{
  width:260px;
  padding:12px;
  font-size:18px;
  border-radius:8px;
  border:1px solid #ccc;
}

.select-group{
  margin-top:25px;
}

button{
  margin-top:20px;
  padding:15px 30px;
  font-size:18px;
  background:#1976d2;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#preview{
  width:350px;
  max-width:95%;
  border-radius:10px;
  border:4px solid #4caf50;
  margin-top:25px;
  display:none;
}

#status{
  margin-top:20px;
  font-size:20px;
  color:green;
  font-weight:bold;
}

.success-page{
  display:none;
  margin-top:100px;
}

.success-page h1{
  color:green;
  font-size:42px;
}

.success-page p{
  font-size:24px;
}

</style>

</head>

<body>

<div id="mainPage">

<h1>ระบบเช็คชื่อพนักงาน</h1>

<div class="input-group">

<label>รหัสพนักงาน</label>

<input
  type="text"
  id="emp_id"
  placeholder="กรอกรหัสพนักงาน">

</div>

<div class="select-group">

<label>เลือกประเภท</label>

<select id="type">
  <option value="IN">เข้างาน</option>
  <option value="OUT">ออกงาน</option>
</select>

</div>

<br><br>

<input
  type="file"
  accept="image/*"
  capture="environment"
  id="cameraInput">

<br>

<img id="preview">

<br>

<button onclick="capture()">
✅ เช็คชื่อ
</button>

<div id="status"></div>

</div>

<div class="success-page" id="successPage">

<h1>เช็คชื่อเรียบร้อย!!</h1>

<p>บันทึกข้อมูลสำเร็จ</p>

</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbwv-yh1hJPzm8sjztqSugsgbuOGZj9zXtG6OZHftWIo2rD1ijSrF1b4Eo2mdvTcUNT0/exec';

const statusText =
  document.getElementById('status');

const preview =
  document.getElementById('preview');

const cameraInput =
  document.getElementById('cameraInput');

let latitude = '';
let longitude = '';

let capturedImage = '';

navigator.geolocation.getCurrentPosition(

  function(position){

    latitude = position.coords.latitude;
    longitude = position.coords.longitude;

  }

);

cameraInput.addEventListener('change', function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    capturedImage = event.target.result;

    preview.src = capturedImage;

    preview.style.display = 'block';

    statusText.innerHTML =
      'ถ่ายรูปเรียบร้อย';

  };

  reader.readAsDataURL(file);

});

async function capture(){

  const empId =
    document.getElementById('emp_id').value;

  const type =
    document.getElementById('type').value;

  if(!empId){

    alert('กรอกรหัสพนักงาน');
    return;

  }

  if(!capturedImage){

    alert('กรุณาถ่ายรูปก่อน');
    return;

  }

  statusText.innerHTML =
    'กำลังบันทึก...';

  try{

    const response = await fetch(API_URL, {

      method:'POST',

      body:JSON.stringify({

        emp_id:empId,
        type:type,
        latitude:latitude,
        longitude:longitude,
        image:capturedImage

      })

    });

    const result = await response.json();

    console.log(result);

    if(result.status == 'success'){

      document.getElementById('mainPage').style.display = 'none';

      document.getElementById('successPage').style.display = 'block';

    }else{

      statusText.innerHTML =
        result.message || 'เกิดข้อผิดพลาด';

    }

  }catch(error){

    console.error(error);

    statusText.innerHTML =
      'เชื่อมต่อระบบไม่สำเร็จ';

  }

}

</script>

</body>
</html>
